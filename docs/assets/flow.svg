<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 975 232" width="975" height="232" role="img" aria-labelledby="title description">
  <title id="title">AgentLoop-lite</title>
  <desc id="description">A planner proposes a tool. The runtime validates its arguments, pauses for approval when required, then records the outcome and attempts in a trace.</desc>
  <style>
    .signal { animation: move 2.8s ease-in-out infinite; }
    @keyframes move {
      0%, 17% { transform: translateX(0); opacity: 0; }
      25% { opacity: 1; }
      56% { transform: translateX(25px); opacity: 1; }
      67%, 100% { transform: translateX(25px); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) { .signal { animation: none; opacity: 0; } }
  </style>
  <rect x="1" y="1" width="973" height="230" rx="18" fill="#0e1524" stroke="#394760"/>
  <g font-family="system-ui, Segoe UI, sans-serif">
    <text x="35" y="59" font-size="32" font-weight="700" fill="#f5f7fb">AgentLoop-lite</text>
    <text x="35" y="88" font-size="16" fill="#bfcbe0">An auditable agent runtime</text>
    
  <rect x="35" y="120" width="192" height="78" rx="12" fill="#171f32" stroke="#394760"/>
  <text x="51" y="147" font-size="13" fill="#7dd3fc">01</text>
  <text x="51" y="168" font-size="16" font-weight="600" fill="#f5f7fb">Plan</text>
  <text x="51" y="186" font-size="12" fill="#bfcbe0">Script or LLM</text>
  <path d="M231 160h34m-7-6 7 6-7 6" fill="none" stroke="#74839e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="signal" cx="233" cy="160" r="3" fill="#7dd3fc" style="animation-delay:0.0s"/>
  <rect x="272" y="120" width="192" height="78" rx="12" fill="#171f32" stroke="#394760"/>
  <text x="288" y="147" font-size="13" fill="#7dd3fc">02</text>
  <text x="288" y="168" font-size="16" font-weight="600" fill="#f5f7fb">Validate tool</text>
  <text x="288" y="186" font-size="12" fill="#bfcbe0">Schema and risk</text>
  <path d="M468 160h34m-7-6 7 6-7 6" fill="none" stroke="#74839e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="signal" cx="470" cy="160" r="3" fill="#7dd3fc" style="animation-delay:0.45s"/>
  <rect x="509" y="120" width="192" height="78" rx="12" fill="#171f32" stroke="#394760"/>
  <text x="525" y="147" font-size="13" fill="#7dd3fc">03</text>
  <text x="525" y="168" font-size="16" font-weight="600" fill="#f5f7fb">Run or pause</text>
  <text x="525" y="186" font-size="12" fill="#bfcbe0">Approval for high risk</text>
  <path d="M705 160h34m-7-6 7 6-7 6" fill="none" stroke="#74839e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="signal" cx="707" cy="160" r="3" fill="#7dd3fc" style="animation-delay:0.9s"/>
  <rect x="746" y="120" width="192" height="78" rx="12" fill="#171f32" stroke="#394760"/>
  <text x="762" y="147" font-size="13" fill="#7dd3fc">04</text>
  <text x="762" y="168" font-size="16" font-weight="600" fill="#f5f7fb">Inspect trace</text>
  <text x="762" y="186" font-size="12" fill="#bfcbe0">Steps and attempts</text>
  </g>
</svg>
